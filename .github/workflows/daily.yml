name: etf-share-daily

on:
  schedule:
    # UTC 00:25 = 北京时间 08:25，两者落在同一自然日，日志/提交时间容易对照。
    # 采集目标固定为"上一交易日"（见 src/collect.py）。该日份额由上交所
    # 22:20、深交所 23:20 前后发布，到次日 08:25 已过约 9 小时，必然齐全。
    # 分钟取 :25 而非 :00 —— UTC 整点是 GitHub Actions 全局调度最密集的
    # 时刻（每天的 daily 任务都堆在这里），错开 25 分钟可显著降低排队延迟。
    # 注意："今天"的判定一律用北京时间（collect.py 内 BJ_TZ），
    # 与 runner 的 UTC 日期、以及本 cron 的排队延迟都解耦。
    - cron: '25 0 * * *'
  workflow_dispatch:   # 允许在 Actions 页面手动补跑

permissions:
  contents: write      # 允许把数据与看板 commit 回仓库

env:
  TZ: Asia/Shanghai    # 双保险：脚本已显式用 UTC+8，这里让 runner 上的其他工具也对齐

jobs:
  collect-and-report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 采集当日 ETF 份额（非交易日自动跳过）
        run: python src/collect.py

      - name: 生成 HTML 看板
        run: python src/build_report.py

      - name: 提交数据与看板
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --staged --quiet; then
            echo "无变更（非交易日或数据未更新），跳过提交"
          else
            git commit -m "chore: ETF份额数据更新 $(date +%Y-%m-%d)"
            git push
          fi

      - name: 部署 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
