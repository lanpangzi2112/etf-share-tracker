name: etf-share-daily

on:
  schedule:
    # UTC 21:05 = 北京时间次日 05:05。
    # 采集目标固定为"上一交易日"（见 src/collect.py）。该日份额由上交所
    # 22:20、深交所 23:20 前后发布，到 05:05 已过约 6 小时，必然齐全；
    # 跑完约 05:15，早上 8 点看到的即是最新数据。
    # 选 05:05 而非 04:00 是留发布余量：万一交易所当晚披露偏迟，
    # 05:05 仍有余地，而 04:00 就可能采空、白等一天。
    # 选 21:05 而非 21:00 是错开整点 —— 整点是 GitHub Actions 全局
    # 调度最密集的时段，凌晨更易准点启动。
    # 注意："今天"的判定一律用北京时间（collect.py 内 BJ_TZ），
    # 与 runner 的 UTC 日期、以及本 cron 的排队延迟都解耦。
    - cron: '5 21 * * *'
  workflow_dispatch:   # 允许在 Actions 页面手动补跑

permissions:
  contents: write      # 允许把数据与看板 commit 回仓库

env:
  TZ: Asia/Shanghai    # 双保险：脚本已显式用 UTC+8，这里让 runner 上的其他工具也对齐

jobs:
  collect-and-report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 采集当日 ETF 份额（非交易日自动跳过）
        run: python src/collect.py

      - name: 生成 HTML 看板
        run: python src/build_report.py

      - name: 提交数据与看板
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --staged --quiet; then
            echo "无变更（非交易日或数据未更新），跳过提交"
          else
            git commit -m "chore: ETF份额数据更新 $(date +%Y-%m-%d)"
            git push
          fi

      - name: 部署 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
