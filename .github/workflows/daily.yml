name: etf-share-daily

on:
  schedule:
    # UTC 21:05 = 北京时间次日 05:05。
    # 为什么不用「UTC 与北京同日」的 00:25？实测过，见 2026-11-22：
    #   设定 08:25（UTC 00:25）→ 实际 15:11 落地，延迟 406 分钟；
    #   设定 07:30（UTC 23:30）→ 实际 10:57~13:12 落地，延迟 3.5~5.7 小时。
    # UTC 00:00 前后是全球 daily 任务的调度峰值，错开 25 分钟远远不够；
    # 真正的低谷在 UTC 18:00~22:00。每天只跑一次时，「同日」与「准点」不可兼得，
    # 这里选准点。
    # 跨日不影响数据：采集目标固定是「上一交易日」（见 src/collect.py 的
    # prev_trade_day），与 cron 落在哪一天无关。
    # 份额发布时点交易所从未公布过时刻表。实测（2026-10-19）：上交所 21:13 空、
    # 22:13 全量，深交所 22:24 仍空；第三方说法有 22:20/23:20、23:00、00:00、
    # 次日 08:30 等多个口径。到次日 05:05 距最晚的说法也已过 5 小时，必然齐全。
    # 注意：「今天」的判定一律用北京时间（collect.py 内 BJ_TZ），与 runner 的
    # UTC 日期、以及本 cron 的排队延迟都解耦。
    - cron: '5 21 * * *'
  workflow_dispatch:   # 允许在 Actions 页面手动补跑

permissions:
  contents: write      # 允许把数据与看板 commit 回仓库

env:
  TZ: Asia/Shanghai    # 双保险：脚本已显式用 UTC+8，这里让 runner 上的其他工具也对齐

jobs:
  collect-and-report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 采集当日 ETF 份额（非交易日自动跳过）
        run: python src/collect.py

      - name: 生成 HTML 看板
        run: python src/build_report.py

      - name: 提交数据与看板
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --staged --quiet; then
            echo "无变更（非交易日或数据未更新），跳过提交"
          else
            git commit -m "chore: ETF份额数据更新 $(date +%Y-%m-%d)"
            git push
          fi

      - name: 部署 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
