name: etf-share-daily

on:
  schedule:
    # UTC 21:35 = 北京时间次日 05:35。
    #
    # 分钟为什么取 :35 —— 官方文档原话「High load times include the start of
    # every hour」，并建议挪到小时内的其他分钟。:35 距前后整点各 25 / 35 分钟，
    # 是这一档位里最远离整点的位置。这是目前唯一有官方依据、能确定的优化。
    #
    # 为什么不再「找低谷」——三组实测延迟（created_at − 设定值）：
    #   UTC 23:30（2026-11 共 12 次）：205~460 分钟，中位约 281
    #   UTC 00:25（1 次）           ：406 分钟
    #   UTC 21:05（2 次）           ：267 / 489 分钟
    # 各时段都落在 3~8 小时，说明延迟主要由 GitHub 全局负载决定，不是选点问题。
    # 22 日曾判断「UTC 18~22 是低谷」，被 21:05 的实测证伪，该结论已删除。
    # 23:30 的老样本略好，但距 00:00 峰值仅 30 分钟，风险更高，故不再采用。
    #
    # 跨日不影响数据：采集目标固定是「上一交易日」（见 src/collect.py 的
    # prev_trade_day），与 cron 落在哪一天无关；「今天」一律按北京时间判定
    # （collect.py 内 BJ_TZ），与 runner 的 UTC 日期、排队延迟都解耦。
    #
    # 份额发布时点交易所从未公布过时刻表。实测 2026-11-24：上交所 22:00 仍空、
    # 23:09 才全量 938 只，深交所 23:23 全量 781 只（11-23 那晚上交所 22:53 已齐，
    # 说明时刻本身浮动）。到次日 05:35 距最后发布已过 6 小时，必然齐全；
    # 即便延迟跨日，missing_trade_days 还会补采最近 3 个交易日兜底。
    - cron: '35 21 * * *'
  workflow_dispatch:   # 允许在 Actions 页面手动补跑

permissions:
  contents: write      # 允许把数据与看板 commit 回仓库

env:
  TZ: Asia/Shanghai    # 双保险：脚本已显式用 UTC+8，这里让 runner 上的其他工具也对齐

jobs:
  collect-and-report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 采集当日 ETF 份额（非交易日自动跳过）
        run: python src/collect.py

      - name: 生成 HTML 看板
        run: python src/build_report.py

      - name: 提交数据与看板
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --staged --quiet; then
            echo "无变更（非交易日或数据未更新），跳过提交"
          else
            git commit -m "chore: ETF份额数据更新 $(date +%Y-%m-%d)"
            git push
          fi

      - name: 部署 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
