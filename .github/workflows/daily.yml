name: etf-share-daily

on:
  schedule:
    # UTC 23:30 = 北京时间次日 07:30。
    # 采集目标固定为"上一交易日"（见 src/collect.py），此时该日数据在交易所
    # 已发布 8 小时以上，必然齐全；早上更新，白天看时是最新的。
    # 避开整点 :00 —— 整点是 GitHub Actions 全局最拥堵的时段，会被延迟数小时。
    - cron: '30 23 * * *'
  workflow_dispatch:   # 允许在 Actions 页面手动补跑

permissions:
  contents: write      # 允许把数据与看板 commit 回仓库

jobs:
  collect-and-report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 采集当日 ETF 份额（非交易日自动跳过）
        run: python src/collect.py

      - name: 生成 HTML 看板
        run: python src/build_report.py

      - name: 提交数据与看板
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --staged --quiet; then
            echo "无变更（非交易日或数据未更新），跳过提交"
          else
            git commit -m "chore: ETF份额数据更新 $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: 部署 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
